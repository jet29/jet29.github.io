<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A planet from layered simplex noise: oceans, coasts, mountains and snow. A new one on every click.">
    <meta name="theme-color" content="#0b0e17">
    <title>Noise planet</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b388ff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../shared.css">
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
    </script>
  </head>
  <body class="demo">
    <canvas id="c" class="scene" aria-label="A rotating planet with oceans and continents"></canvas>

    <footer>
      <a href="../">all demos</a>
      <button id="new" type="button">new planet</button>
      <label>
        <span>sea level</span>
        <input id="sea" type="range" min="-0.3" max="0.3" step="0.01" value="0">
        <output id="sea-out">0.00</output>
      </label>
      <span id="info"></span>
    </footer>

    <script type="module" src="./planet.js"></script>
  </body>
</html>
