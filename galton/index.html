<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A 3D Galton board: every ball flips a coin at every peg, and the pile becomes a bell curve.">
    <meta name="theme-color" content="#0b0e17">
    <title>Galton board</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b388ff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../shared.css">
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
    </script>
  </head>
  <body class="demo">
    <canvas id="board" class="scene" aria-label="A Galton board: balls fall through pegs and pile up into a bell curve"></canvas>

    <footer>
      <a href="../">all demos</a>
      <label>
        <span>bias</span>
        <input id="bias" type="range" min="0.1" max="0.9" step="0.05" value="0.5">
        <output id="bias-out">0.50</output>
      </label>
      <span id="count">0 balls</span>
    </footer>

    <script type="module" src="./galton.js"></script>
  </body>
</html>
