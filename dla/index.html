<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Diffusion-limited aggregation in 3D: particles wander at random until they touch the crystal and stick.">
    <meta name="theme-color" content="#0b0e17">
    <title>Diffusion-limited aggregation</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b388ff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../shared.css">
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
    </script>
  </head>
  <body class="demo">
    <canvas id="c" class="scene" aria-label="A branching crystal growing from a single seed"></canvas>

    <footer>
      <a href="../">all demos</a>
      <label>
        <span>stickiness</span>
        <input id="stick" type="range" min="0.05" max="1" step="0.05" value="1">
        <output id="stick-out">1.00</output>
      </label>
      <span id="info"></span>
    </footer>

    <script type="module" src="./dla.js"></script>
  </body>
</html>
