<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Thousands of particles taking random steps in 3D. The cloud spreads as the square root of time.">
    <meta name="theme-color" content="#0b0e17">
    <title>Random walk</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='12' fill='%23b388ff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../shared.css">
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
    </script>
  </head>
  <body class="demo">
    <canvas id="c" class="scene" aria-label="A cloud of particles spreading out from a point by random steps"></canvas>

    <footer>
      <a href="../">all demos</a>
      <label>
        <span>step</span>
        <input id="step" type="range" min="0.03" max="0.15" step="0.01" value="0.08">
        <output id="step-out">0.08</output>
      </label>
      <span id="info"></span>
    </footer>

    <script type="module" src="./walk.js"></script>
  </body>
</html>
